<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="thm-t thm-d" id="svg-thm"><title id="thm-t">THM coupling in a soil profile</title><desc id="thm-d">Cross-section of three soil layers with downward heat flux and isotherms, groundwater flow and a pore-water pressure profile, and a surface load producing a stress bulb and surface settlement. A side panel shows the coupling between thermal, hydraulic and mechanical fields.</desc><style>
.t{font:14px Inter,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;fill:var(--f-ink,#e8eff5)}
.tm{fill:var(--f-mute,#9db0c0)}.tb{font-weight:600}.tl{font-size:16px}.ts{font-size:13px}
.halo{paint-order:stroke;stroke:var(--f-bg,#0c1a28);stroke-width:4px;stroke-linejoin:round}
.ln{stroke:var(--f-line,#7e93a5);stroke-width:1.5;fill:none}.thin{stroke-width:1}.dash{stroke-dasharray:6 5}
.th{stroke:var(--f-th,#ef7d57);stroke-width:2;fill:none}.hy{stroke:var(--f-hy,#4aa3e8);stroke-width:2;fill:none}.me{stroke:var(--f-me,#e0b04a);stroke-width:2;fill:none}
.fth{fill:var(--f-th,#ef7d57)}.fhy{fill:var(--f-hy,#4aa3e8)}.fme{fill:var(--f-me,#e0b04a)}.fink{fill:var(--f-ink,#e8eff5)}
.bg{fill:var(--f-bg,#0c1a28)}.s1{fill:var(--f-s1,#4a4036)}.s2{fill:var(--f-s2,#2f4a5c)}.s3{fill:var(--f-s3,#3a3f46)}
.box{fill:var(--f-s3,#3a3f46);fill-opacity:.55;stroke:var(--f-line,#7e93a5);stroke-width:1.5}
</style><defs><marker id="thm-mth" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-th,#ef7d57)"/></marker><marker id="thm-mhy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-hy,#4aa3e8)"/></marker><marker id="thm-mme" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-me,#e0b04a)"/></marker><marker id="thm-mink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-line,#7e93a5)"/></marker></defs><rect class="bg" width="800" height="470" rx="6"/><text class="t tb tl" x="24" y="32">Thermo-hydro-mechanical coupling in a soil profile</text><text class="t tm ts" x="24" y="52">Schematic only. Not measured data.</text><rect class="s1" x="40" y="120" width="440" height="80"/><rect class="s2" x="40" y="200" width="440" height="90"/><rect class="s3" x="40" y="290" width="440" height="110"/><rect class="ln" x="40" y="120" width="440" height="280"/><line class="ln" x1="40" y1="200" x2="480" y2="200"/><line class="ln" x1="40" y1="290" x2="480" y2="290"/><line class="ln" x1="30" y1="120" x2="490" y2="120" style="stroke-width:3"/><text class="t tm ts" x="44" y="110">Ground surface</text><text class="t tm ts halo" x="474" y="194" text-anchor="end">Layer 1: low permeability</text><text class="t tm ts halo" x="474" y="284" text-anchor="end">Layer 2: permeable, saturated</text><text class="t tm ts halo" x="474" y="394" text-anchor="end">Layer 3: stiff, low permeability</text><line class="hy thin dash" x1="40" y1="150" x2="480" y2="150"/><text class="t ts halo" x="474" y="145" text-anchor="end">Water table</text><g data-layer="thermal" data-tip="Thermal field: heat conducts downward along the temperature gradient. Isotherms bend where layers differ in conductivity or where moving water carries heat." tabindex="0"><line class="th" x1="70" y1="128" x2="70" y2="184" marker-end="url(#thm-mth)"/><line class="th" x1="110" y1="128" x2="110" y2="184" marker-end="url(#thm-mth)"/><line class="th" x1="150" y1="128" x2="150" y2="184" marker-end="url(#thm-mth)"/><text class="t ts halo" x="166" y="160">Heat flux</text><path class="th thin dash" d="M40 212 Q 260 204 480 212"/><path class="th thin dash" d="M40 312 Q 260 304 480 312"/><path class="th thin dash" d="M40 372 Q 260 364 480 372"/><text class="t ts halo" x="52" y="330">Isotherms T₁ > T₂ > T₃</text></g><g data-layer="hydraulic" data-tip="Hydraulic field: water flows from high to low hydraulic head. Pore-water pressure rises with depth below the water table; the dashed line is the hydrostatic reference." tabindex="0"><line class="hy" x1="66" y1="238" x2="330" y2="238" marker-end="url(#thm-mhy)"/><line class="hy" x1="66" y1="254" x2="330" y2="254" marker-end="url(#thm-mhy)"/><line class="hy" x1="66" y1="270" x2="330" y2="270" marker-end="url(#thm-mhy)"/><text class="t ts halo" x="66" y="228">Groundwater flow</text><path class="hy thin dash" d="M490 150 L580 400"/><path class="hy" d="M490 150 L540 250 Q 566 290 562 320 L 580 400"/><text class="t ts" x="488" y="132">Pore pressure u →</text></g><g data-layer="mechanical" data-tip="Mechanical field: the surface load spreads into a stress bulb and deforms the soil skeleton. Effective stress equals total stress minus pore-water pressure." tabindex="0"><line class="me" x1="232" y1="66" x2="232" y2="106" marker-end="url(#thm-mme)"/><line class="me" x1="260" y1="66" x2="260" y2="106" marker-end="url(#thm-mme)"/><line class="me" x1="288" y1="66" x2="288" y2="106" marker-end="url(#thm-mme)"/><rect class="fme" x="216" y="108" width="88" height="12"/><text class="t ts" x="312" y="92">Applied load q</text><path class="me dash" d="M40 121 Q 150 124 260 141 T 480 121"/><ellipse class="me thin dash" cx="260" cy="190" rx="60" ry="50"/><ellipse class="me thin dash" cx="260" cy="200" rx="105" ry="95"/><text class="t ts halo" x="366" y="340">Stress bulb σ</text><text class="t ts" x="340" y="112">Deformed surface (dashed)</text></g><text class="t tb" x="612" y="100">Fields</text><line class="th" x1="612" y1="120" x2="642" y2="120"/><text class="t ts" x="652" y="124">Thermal (T)</text><line class="hy" x1="612" y1="144" x2="642" y2="144"/><text class="t ts" x="652" y="148">Hydraulic (H)</text><line class="me" x1="612" y1="168" x2="642" y2="168"/><text class="t ts" x="652" y="172">Mechanical (M)</text><text class="t tb" x="612" y="220">Coupling</text><line class="ln" x1="662" y1="283" x2="628" y2="325" marker-end="url(#thm-mink)" marker-start="url(#thm-mink)"/><line class="ln" x1="682" y1="283" x2="716" y2="325" marker-end="url(#thm-mink)" marker-start="url(#thm-mink)"/><line class="ln" x1="644" y1="345" x2="700" y2="345" marker-end="url(#thm-mink)" marker-start="url(#thm-mink)"/><circle cx="672" cy="265" r="18" class="bg th" style="stroke-width:2.5"/><text class="t tb" x="672" y="270" text-anchor="middle">T</text><circle cx="622" cy="345" r="18" class="bg hy" style="stroke-width:2.5"/><text class="t tb" x="622" y="350" text-anchor="middle">H</text><circle cx="722" cy="345" r="18" class="bg me" style="stroke-width:2.5"/><text class="t tb" x="722" y="350" text-anchor="middle">M</text></svg>