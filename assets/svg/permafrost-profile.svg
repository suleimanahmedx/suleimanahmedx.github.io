<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="perm-t perm-d" id="svg-perm"><title id="perm-t">Permafrost cross-section</title><desc id="perm-d">Vertical section showing the ground surface, active layer, permafrost table, frozen permafrost and unfrozen ground below, with a downward thaw front, thickness brackets and a schematic summer and winter temperature profile.</desc><style>
.t{font:14px Inter,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;fill:var(--f-ink,#e8eff5)}
.tm{fill:var(--f-mute,#9db0c0)}.tb{font-weight:600}.tl{font-size:16px}.ts{font-size:13px}
.halo{paint-order:stroke;stroke:var(--f-bg,#0c1a28);stroke-width:4px;stroke-linejoin:round}
.ln{stroke:var(--f-line,#7e93a5);stroke-width:1.5;fill:none}.thin{stroke-width:1}.dash{stroke-dasharray:6 5}
.th{stroke:var(--f-th,#ef7d57);stroke-width:2;fill:none}.hy{stroke:var(--f-hy,#4aa3e8);stroke-width:2;fill:none}.me{stroke:var(--f-me,#e0b04a);stroke-width:2;fill:none}
.fth{fill:var(--f-th,#ef7d57)}.fhy{fill:var(--f-hy,#4aa3e8)}.fme{fill:var(--f-me,#e0b04a)}.fink{fill:var(--f-ink,#e8eff5)}
.bg{fill:var(--f-bg,#0c1a28)}.s1{fill:var(--f-s1,#4a4036)}.s2{fill:var(--f-s2,#2f4a5c)}.s3{fill:var(--f-s3,#3a3f46)}
.box{fill:var(--f-s3,#3a3f46);fill-opacity:.55;stroke:var(--f-line,#7e93a5);stroke-width:1.5}
</style><defs><marker id="perm-mth" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-th,#ef7d57)"/></marker><marker id="perm-mhy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-hy,#4aa3e8)"/></marker><marker id="perm-mme" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-me,#e0b04a)"/></marker><marker id="perm-mink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-line,#7e93a5)"/></marker></defs><rect class="bg" width="800" height="490" rx="6"/><text class="t tb tl" x="24" y="32">Permafrost cross-section with active layer</text><text class="t tm ts" x="24" y="52">Schematic only. Not measured data.</text><defs><pattern id="perm-ice" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14L14 0" stroke="#9bd8f0" stroke-opacity=".5" stroke-width="1.2"/></pattern></defs><rect class="s1" x="130" y="130" width="410" height="80"/><rect class="s2" x="130" y="210" width="410" height="140"/><rect x="130" y="210" width="410" height="140" fill="url(#perm-ice)"/><rect class="s3" x="130" y="350" width="410" height="90"/><rect class="ln" x="130" y="130" width="410" height="310"/><line class="ln" x1="120" y1="130" x2="550" y2="130" style="stroke-width:3"/><text class="t tm ts" x="136" y="122">Ground surface</text><line class="ln" x1="130" y1="350" x2="540" y2="350"/><g data-layer="active" data-tip="Active layer: the near-surface soil that thaws each summer and refreezes in winter. Its thickness (ALT) is controlled by air temperature, snow cover, vegetation, soil moisture and soil properties." tabindex="0"><line class="th" x1="470" y1="136" x2="470" y2="204" marker-end="url(#perm-mth)"/><text class="t ts halo" x="136" y="160">Thaw front advances downward in summer</text><text class="t tb ts halo" x="136" y="192">Active layer (seasonally thawed)</text><line class="ln" x1="118" y1="132" x2="118" y2="208" marker-end="url(#perm-mink)" marker-start="url(#perm-mink)"/><text class="t ts" x="108" y="160" text-anchor="end">Active layer</text><text class="t ts" x="108" y="176" text-anchor="end">thickness</text><text class="t ts" x="108" y="192" text-anchor="end">(ALT)</text></g><g data-layer="table" data-tip="Permafrost table: the surface separating the seasonally thawed active layer above from the perennially frozen ground below." tabindex="0"><line class="th dash" x1="130" y1="210" x2="540" y2="210" style="stroke-width:2.5"/><text class="t tb ts halo" x="136" y="232">Permafrost table (top of permafrost)</text></g><g data-layer="frozen" data-tip="Permafrost: ground that remains at or below 0 °C for at least two consecutive years. Ice content strongly controls its strength, stiffness and thermal properties." tabindex="0"><text class="t ts halo" x="136" y="282">Permafrost: ground at or below 0 °C</text><text class="t ts halo" x="136" y="300">for two or more consecutive years</text><line class="ln" x1="118" y1="212" x2="118" y2="348" marker-end="url(#perm-mink)" marker-start="url(#perm-mink)"/><text class="t ts" x="110" y="276" text-anchor="end">Permafrost</text><text class="t ts" x="110" y="292" text-anchor="end">thickness</text></g><text class="t ts halo" x="136" y="400">Unfrozen ground below permafrost</text><text class="t tb ts" x="570" y="118">Temperature profile</text><rect class="ln thin" x="570" y="130" width="220" height="310"/><line class="ln dash thin" x1="700" y1="130" x2="700" y2="440"/><g data-layer="profile" data-tip="Temperature profile: summer and winter curves envelope the seasonal swing. They converge at the depth of zero annual amplitude, below which temperature follows the geothermal gradient and crosses 0 °C at the base of permafrost." tabindex="0"><path class="th" d="M770 130 C740 180 700 215 680 255 C670 275 666 285 664 292"/><path class="hy" d="M612 130 C625 180 650 240 660 280 C663 288 664 291 664 292"/><path class="ln" d="M664 292 L700 350 L756 440"/><circle cx="664" cy="292" r="4" class="fink"/><text class="t ts halo" x="750" y="190" text-anchor="middle">Summer</text><text class="t ts halo" x="590" y="210">Winter</text><text class="t ts halo" x="654" y="296" text-anchor="end">zero annual</text><text class="t ts halo" x="654" y="312" text-anchor="end">amplitude</text></g><text class="t tm ts" x="574" y="458">colder</text><text class="t tm ts" x="700" y="458" text-anchor="middle">0 °C</text><text class="t tm ts" x="786" y="458" text-anchor="end">warmer</text><text class="t tm ts" x="660" y="478" text-anchor="middle">Depth increases downward</text></svg>