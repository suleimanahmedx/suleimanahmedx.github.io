<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img" aria-labelledby="mp-t mp-d" id="svg-mp"><title id="mp-t">Coupled multiphysics model</title><desc id="mp-d">Three field boxes for temperature, groundwater flow and deformation connected by double-headed arrows labelled with their coupling mechanisms, and a central ellipse for material behaviour that links all three.</desc><style>
.t{font:14px Inter,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;fill:var(--f-ink,#e8eff5)}
.tm{fill:var(--f-mute,#9db0c0)}.tb{font-weight:600}.tl{font-size:16px}.ts{font-size:13px}
.halo{paint-order:stroke;stroke:var(--f-bg,#0c1a28);stroke-width:4px;stroke-linejoin:round}
.ln{stroke:var(--f-line,#7e93a5);stroke-width:1.5;fill:none}.thin{stroke-width:1}.dash{stroke-dasharray:6 5}
.th{stroke:var(--f-th,#ef7d57);stroke-width:2;fill:none}.hy{stroke:var(--f-hy,#4aa3e8);stroke-width:2;fill:none}.me{stroke:var(--f-me,#e0b04a);stroke-width:2;fill:none}
.fth{fill:var(--f-th,#ef7d57)}.fhy{fill:var(--f-hy,#4aa3e8)}.fme{fill:var(--f-me,#e0b04a)}.fink{fill:var(--f-ink,#e8eff5)}
.bg{fill:var(--f-bg,#0c1a28)}.s1{fill:var(--f-s1,#4a4036)}.s2{fill:var(--f-s2,#2f4a5c)}.s3{fill:var(--f-s3,#3a3f46)}
.box{fill:var(--f-s3,#3a3f46);fill-opacity:.55;stroke:var(--f-line,#7e93a5);stroke-width:1.5}
</style><defs><marker id="mp-mth" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-th,#ef7d57)"/></marker><marker id="mp-mhy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-hy,#4aa3e8)"/></marker><marker id="mp-mme" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-me,#e0b04a)"/></marker><marker id="mp-mink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-line,#7e93a5)"/></marker></defs><rect class="bg" width="800" height="456" rx="6"/><text class="t tb tl" x="24" y="32">Coupled multiphysics in a geotechnical domain</text><text class="t tm ts" x="24" y="52">Conceptual map of field interactions</text><rect class="box" x="115" y="120" width="170" height="60" rx="4" style="stroke:var(--f-th,#ef7d57);stroke-width:2.5"/><text class="t tb" x="200" y="155" text-anchor="middle">Temperature</text><rect class="box" x="515" y="120" width="170" height="60" rx="4" style="stroke:var(--f-hy,#4aa3e8);stroke-width:2.5"/><text class="t tb" x="600" y="155" text-anchor="middle">Groundwater flow</text><rect class="box" x="305" y="340" width="190" height="60" rx="4" style="stroke:var(--f-me,#e0b04a);stroke-width:2.5"/><text class="t tb" x="400" y="375" text-anchor="middle">Deformation</text><g data-layer="th-hy" data-tip="Thermal–hydraulic coupling: temperature changes fluid viscosity and ice–water phase, while moving water transports heat by advection." tabindex="0"><line class="ln" x1="288" y1="150" x2="512" y2="150" marker-end="url(#mp-mink)" marker-start="url(#mp-mink)"/><text class="t ts" x="400" y="100" text-anchor="middle">T → H: viscosity, ice–water phase change</text><text class="t ts" x="400" y="117" text-anchor="middle">H → T: advective heat transport</text></g><g data-layer="t-m" data-tip="Thermo-mechanical coupling: temperature change causes thermal and freeze–thaw strains; deformation changes porosity and with it the thermal conductivity." tabindex="0"><line class="ln" x1="215" y1="182" x2="330" y2="345" marker-end="url(#mp-mink)" marker-start="url(#mp-mink)"/><text class="t ts" x="236" y="232" text-anchor="end">T → M: thermal strain,</text><text class="t ts" x="236" y="249" text-anchor="end">thaw settlement</text><text class="t ts" x="236" y="266" text-anchor="end">M → T: porosity changes</text><text class="t ts" x="236" y="283" text-anchor="end">thermal conductivity</text></g><g data-layer="h-m" data-tip="Hydro-mechanical coupling: pore-water pressure changes effective stress, while deformation changes porosity and permeability." tabindex="0"><line class="ln" x1="585" y1="182" x2="470" y2="345" marker-end="url(#mp-mink)" marker-start="url(#mp-mink)"/><text class="t ts" x="566" y="232">H → M: pore pressure</text><text class="t ts" x="566" y="249">changes effective stress</text><text class="t ts" x="566" y="266">M → H: porosity changes</text><text class="t ts" x="566" y="283">permeability</text></g><g data-layer="material" data-tip="Material behaviour: stiffness, strength, conductivity and permeability depend on temperature, saturation and ice content, so constitutive laws link all three fields." tabindex="0"><ellipse class="box" cx="400" cy="262" rx="105" ry="42"/><text class="t tb" x="400" y="258" text-anchor="middle">Material behaviour</text><text class="t tm ts" x="400" y="277" text-anchor="middle">constitutive laws</text></g><text class="t tm ts" x="400" y="424" text-anchor="middle">Constitutive laws make stiffness, strength, conductivity and permeability</text><text class="t tm ts" x="400" y="441" text-anchor="middle">depend on temperature, saturation and ice content.</text></svg>