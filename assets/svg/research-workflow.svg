<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="wf-t wf-d" id="svg-wf"><title id="wf-t">Numerical research workflow</title><desc id="wf-d">Eight numbered steps in a snaking sequence: physical problem, conceptual model, governing equations, constitutive laws, implementation, calibration and validation, simulation and interpretation, with a feedback arrow from calibration back to the model.</desc><style>
.t{font:14px Inter,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;fill:var(--f-ink,#e8eff5)}
.tm{fill:var(--f-mute,#9db0c0)}.tb{font-weight:600}.tl{font-size:16px}.ts{font-size:13px}
.halo{paint-order:stroke;stroke:var(--f-bg,#0c1a28);stroke-width:4px;stroke-linejoin:round}
.ln{stroke:var(--f-line,#7e93a5);stroke-width:1.5;fill:none}.thin{stroke-width:1}.dash{stroke-dasharray:6 5}
.th{stroke:var(--f-th,#ef7d57);stroke-width:2;fill:none}.hy{stroke:var(--f-hy,#4aa3e8);stroke-width:2;fill:none}.me{stroke:var(--f-me,#e0b04a);stroke-width:2;fill:none}
.fth{fill:var(--f-th,#ef7d57)}.fhy{fill:var(--f-hy,#4aa3e8)}.fme{fill:var(--f-me,#e0b04a)}.fink{fill:var(--f-ink,#e8eff5)}
.bg{fill:var(--f-bg,#0c1a28)}.s1{fill:var(--f-s1,#4a4036)}.s2{fill:var(--f-s2,#2f4a5c)}.s3{fill:var(--f-s3,#3a3f46)}
.box{fill:var(--f-s3,#3a3f46);fill-opacity:.55;stroke:var(--f-line,#7e93a5);stroke-width:1.5}
</style><defs><marker id="wf-mth" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-th,#ef7d57)"/></marker><marker id="wf-mhy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-hy,#4aa3e8)"/></marker><marker id="wf-mme" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-me,#e0b04a)"/></marker><marker id="wf-mink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-line,#7e93a5)"/></marker></defs><rect class="bg" width="800" height="440" rx="6"/><text class="t tb tl" x="24" y="32">Numerical research workflow</text><text class="t tm ts" x="24" y="52">From physical problem to engineering interpretation</text><g data-layer="step1"><rect class="box" x="15" y="80" width="170" height="106" rx="4"/><circle cx="35" cy="100" r="12" class="bg ln"/><text class="t ts tb" x="35" y="105" text-anchor="middle">1</text><text class="t tb ts" x="27" y="136">Physical problem</text><text class="t tm ts" x="27" y="156">Site, loads, boundary</text><text class="t tm ts" x="27" y="173">conditions, objectives</text></g><g data-layer="step2"><rect class="box" x="215" y="80" width="170" height="106" rx="4"/><circle cx="235" cy="100" r="12" class="bg ln"/><text class="t ts tb" x="235" y="105" text-anchor="middle">2</text><text class="t tb ts" x="227" y="136">Conceptual model</text><text class="t tm ts" x="227" y="156">Processes, geometry,</text><text class="t tm ts" x="227" y="173">key assumptions</text></g><g data-layer="step3"><rect class="box" x="415" y="80" width="170" height="106" rx="4"/><circle cx="435" cy="100" r="12" class="bg ln"/><text class="t ts tb" x="435" y="105" text-anchor="middle">3</text><text class="t tb ts" x="427" y="136">Governing equations</text><text class="t tm ts" x="427" y="156">Energy, mass and</text><text class="t tm ts" x="427" y="173">momentum balance</text></g><g data-layer="step4"><rect class="box" x="615" y="80" width="170" height="106" rx="4"/><circle cx="635" cy="100" r="12" class="bg ln"/><text class="t ts tb" x="635" y="105" text-anchor="middle">4</text><text class="t tb ts" x="627" y="136">Constitutive laws</text><text class="t tm ts" x="627" y="156">Stress–strain, thermal</text><text class="t tm ts" x="627" y="173">and hydraulic response</text></g><g data-layer="step5"><rect class="box" x="615" y="260" width="170" height="106" rx="4"/><circle cx="635" cy="280" r="12" class="bg ln"/><text class="t ts tb" x="635" y="285" text-anchor="middle">5</text><text class="t tb ts" x="627" y="316">Implementation</text><text class="t tm ts" x="627" y="336">FEM discretisation,</text><text class="t tm ts" x="627" y="353">solver, time stepping</text></g><g data-layer="step6"><rect class="box" x="415" y="260" width="170" height="106" rx="4"/><circle cx="435" cy="280" r="12" class="bg ln"/><text class="t ts tb" x="435" y="285" text-anchor="middle">6</text><text class="t tb ts" x="427" y="316">Calibration</text><text class="t tm ts" x="427" y="336">and validation against</text><text class="t tm ts" x="427" y="353">field or lab data</text></g><g data-layer="step7"><rect class="box" x="215" y="260" width="170" height="106" rx="4"/><circle cx="235" cy="280" r="12" class="bg ln"/><text class="t ts tb" x="235" y="285" text-anchor="middle">7</text><text class="t tb ts" x="227" y="316">Simulation</text><text class="t tm ts" x="227" y="336">Scenarios, sensitivity,</text><text class="t tm ts" x="227" y="353">parameter studies</text></g><g data-layer="step8"><rect class="box" x="15" y="260" width="170" height="106" rx="4"/><circle cx="35" cy="280" r="12" class="bg ln"/><text class="t ts tb" x="35" y="285" text-anchor="middle">8</text><text class="t tb ts" x="27" y="316">Interpretation</text><text class="t tm ts" x="27" y="336">Engineering conclusions</text><text class="t tm ts" x="27" y="353">and stated limits</text></g><line class="ln" x1="185" y1="133" x2="215" y2="133" marker-end="url(#wf-mink)"/><line class="ln" x1="385" y1="133" x2="415" y2="133" marker-end="url(#wf-mink)"/><line class="ln" x1="585" y1="133" x2="615" y2="133" marker-end="url(#wf-mink)"/><line class="ln" x1="700" y1="186" x2="700" y2="260" marker-end="url(#wf-mink)"/><line class="ln" x1="615" y1="313" x2="585" y2="313" marker-end="url(#wf-mink)"/><line class="ln" x1="415" y1="313" x2="385" y2="313" marker-end="url(#wf-mink)"/><line class="ln" x1="215" y1="313" x2="185" y2="313" marker-end="url(#wf-mink)"/><path class="th dash" marker-end="url(#wf-mth)" d="M500 260 V186"/><text class="t ts" x="510" y="232">refine model</text><text class="t tm ts" x="24" y="404">Calibration and validation feed back into the conceptual model and constitutive laws</text><text class="t tm ts" x="24" y="421">before conclusions are drawn.</text></svg>