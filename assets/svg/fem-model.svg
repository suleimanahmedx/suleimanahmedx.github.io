<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="fem-t fem-d" id="svg-fem"><title id="fem-t">Finite-element model</title><desc id="fem-d">A rectangular soil domain with a graded finite-element mesh refined beneath a surface load, roller supports on the sides, pinned supports at the base, displacement vectors and stress concentrations at the load edges. An inset shows a single four-node element with nodes and Gauss points.</desc><style>
.t{font:14px Inter,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;fill:var(--f-ink,#e8eff5)}
.tm{fill:var(--f-mute,#9db0c0)}.tb{font-weight:600}.tl{font-size:16px}.ts{font-size:13px}
.halo{paint-order:stroke;stroke:var(--f-bg,#0c1a28);stroke-width:4px;stroke-linejoin:round}
.ln{stroke:var(--f-line,#7e93a5);stroke-width:1.5;fill:none}.thin{stroke-width:1}.dash{stroke-dasharray:6 5}
.th{stroke:var(--f-th,#ef7d57);stroke-width:2;fill:none}.hy{stroke:var(--f-hy,#4aa3e8);stroke-width:2;fill:none}.me{stroke:var(--f-me,#e0b04a);stroke-width:2;fill:none}
.fth{fill:var(--f-th,#ef7d57)}.fhy{fill:var(--f-hy,#4aa3e8)}.fme{fill:var(--f-me,#e0b04a)}.fink{fill:var(--f-ink,#e8eff5)}
.bg{fill:var(--f-bg,#0c1a28)}.s1{fill:var(--f-s1,#4a4036)}.s2{fill:var(--f-s2,#2f4a5c)}.s3{fill:var(--f-s3,#3a3f46)}
.box{fill:var(--f-s3,#3a3f46);fill-opacity:.55;stroke:var(--f-line,#7e93a5);stroke-width:1.5}
</style><defs><marker id="fem-mth" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-th,#ef7d57)"/></marker><marker id="fem-mhy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-hy,#4aa3e8)"/></marker><marker id="fem-mme" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-me,#e0b04a)"/></marker><marker id="fem-mink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-line,#7e93a5)"/></marker></defs><rect class="bg" width="800" height="470" rx="6"/><text class="t tb tl" x="24" y="32">Finite-element model of a loaded soil domain</text><text class="t tm ts" x="24" y="52">Schematic only. Not a simulation result.</text><g data-layer="mesh" data-tip="Finite-element mesh: the domain is divided into elements. Elements are smaller where stress and displacement gradients are steep, such as beneath the load, and larger far from it." tabindex="0"><rect class="s2" x="60" y="100" width="440" height="320" fill-opacity=".35"/><line class="ln thin" x1="60.0" y1="100" x2="60.0" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="104.7" y1="100" x2="104.7" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="145.1" y1="100" x2="145.1" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="181.0" y1="100" x2="181.0" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="212.3" y1="100" x2="212.3" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="238.5" y1="100" x2="238.5" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="259.2" y1="100" x2="259.2" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="273.6" y1="100" x2="273.6" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="280.0" y1="100" x2="280.0" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="286.4" y1="100" x2="286.4" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="300.8" y1="100" x2="300.8" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="321.5" y1="100" x2="321.5" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="347.7" y1="100" x2="347.7" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="379.0" y1="100" x2="379.0" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="414.9" y1="100" x2="414.9" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="455.3" y1="100" x2="455.3" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="500.0" y1="100" x2="500.0" y2="420" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="100.0" x2="500" y2="100.0" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="108.0" x2="500" y2="108.0" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="124.4" x2="500" y2="124.4" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="146.6" x2="500" y2="146.6" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="173.9" x2="500" y2="173.9" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="205.6" x2="500" y2="205.6" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="241.3" x2="500" y2="241.3" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="280.8" x2="500" y2="280.8" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="323.9" x2="500" y2="323.9" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="370.4" x2="500" y2="370.4" style="stroke-opacity:.55"/><line class="ln thin" x1="60" y1="420.0" x2="500" y2="420.0" style="stroke-opacity:.55"/><rect class="ln" x="60" y="100" width="440" height="320"/></g><g data-layer="bc" data-tip="Boundary conditions: rollers on the sides restrain horizontal displacement; pins at the base restrain both components. Far boundaries should be distant enough not to influence the result." tabindex="0"><circle cx="52" cy="140" r="5" class="bg ln"/><circle cx="508" cy="140" r="5" class="bg ln"/><circle cx="52" cy="200" r="5" class="bg ln"/><circle cx="508" cy="200" r="5" class="bg ln"/><circle cx="52" cy="260" r="5" class="bg ln"/><circle cx="508" cy="260" r="5" class="bg ln"/><circle cx="52" cy="320" r="5" class="bg ln"/><circle cx="508" cy="320" r="5" class="bg ln"/><circle cx="52" cy="380" r="5" class="bg ln"/><circle cx="508" cy="380" r="5" class="bg ln"/><path class="bg ln" d="M100 420 l-9 15 h18z"/><path class="bg ln" d="M190 420 l-9 15 h18z"/><path class="bg ln" d="M280 420 l-9 15 h18z"/><path class="bg ln" d="M370 420 l-9 15 h18z"/><path class="bg ln" d="M460 420 l-9 15 h18z"/></g><g data-layer="load" data-tip="Applied load: a distributed surface pressure on the loaded patch is converted to equivalent nodal forces." tabindex="0"><line class="me" x1="240" y1="62" x2="240" y2="96" marker-end="url(#fem-mme)"/><line class="me" x1="260" y1="62" x2="260" y2="96" marker-end="url(#fem-mme)"/><line class="me" x1="280" y1="62" x2="280" y2="96" marker-end="url(#fem-mme)"/><line class="me" x1="300" y1="62" x2="300" y2="96" marker-end="url(#fem-mme)"/><line class="me" x1="320" y1="62" x2="320" y2="96" marker-end="url(#fem-mme)"/><text class="t ts" x="338" y="80">Applied load q</text></g><g data-layer="response" data-tip="Response: displacement vectors point downward and outward beneath the load and decay with depth. Stress concentrates near the edges of the loaded patch." tabindex="0"><defs><radialGradient id="fem-sc"><stop offset="0" stop-color="#ef7d57" stop-opacity=".65"/><stop offset="1" stop-color="#ef7d57" stop-opacity="0"/></radialGradient></defs><ellipse cx="228" cy="112" rx="34" ry="30" fill="url(#fem-sc)"/><ellipse cx="332" cy="112" rx="34" ry="30" fill="url(#fem-sc)"/><line class="me" x1="280" y1="140" x2="280" y2="174" marker-end="url(#fem-mme)"/><line class="me" x1="280" y1="196" x2="280" y2="224" marker-end="url(#fem-mme)"/><line class="me" x1="280" y1="250" x2="280" y2="272" marker-end="url(#fem-mme)"/><line class="me" x1="280" y1="300" x2="280" y2="316" marker-end="url(#fem-mme)"/><line class="me" x1="222" y1="150" x2="214" y2="178" marker-end="url(#fem-mme)"/><line class="me" x1="338" y1="150" x2="346" y2="178" marker-end="url(#fem-mme)"/></g><text class="t tb" x="560" y="118">Legend</text><line class="me" x1="562" y1="140" x2="590" y2="140" marker-end="url(#fem-mme)"/><text class="t ts" x="600" y="145">Displacement vector</text><circle cx="575" cy="166" r="5" class="bg ln"/><text class="t ts" x="600" y="171">Roller (horizontal fixed)</text><path class="bg ln" d="M575 190 l-8 14 h16z"/><text class="t ts" x="600" y="200">Pin (fully fixed)</text><ellipse cx="575" cy="224" rx="14" ry="9" fill="url(#fem-sc)"/><text class="t ts" x="600" y="229">Stress concentration</text><text class="t tb" x="560" y="280">One 4-node element</text><path class="ln" d="M590 410 L740 400 L755 310 L598 322 z"/><circle cx="590" cy="410" r="5" class="fink"/><circle cx="740" cy="400" r="5" class="fink"/><circle cx="755" cy="310" r="5" class="fink"/><circle cx="598" cy="322" r="5" class="fink"/><rect x="620.2" y="385.7" width="7" height="7" class="fth"/><rect x="707.7" y="379.7" width="7" height="7" class="fth"/><rect x="715.5" y="328.0" width="7" height="7" class="fth"/><rect x="625.7" y="334.6" width="7" height="7" class="fth"/><rect x="566" y="372" width="9" height="9" class="fink"/><text class="t ts" x="582" y="380">Node</text><rect x="566" y="344" width="9" height="9" class="fth"/><text class="t ts" x="582" y="352">Gauss point</text></svg>