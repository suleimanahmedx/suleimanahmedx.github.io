<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="ssi-t ssi-d" id="svg-ssi"><title id="ssi-t">Soil–structure interaction</title><desc id="ssi-d">A column and spread footing load a two-layer soil profile. The figure shows the soil–foundation interface, upward soil reaction, stress isobars beneath the footing and an exaggerated settlement profile plotted below the soil block.</desc><style>
.t{font:14px Inter,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;fill:var(--f-ink,#e8eff5)}
.tm{fill:var(--f-mute,#9db0c0)}.tb{font-weight:600}.tl{font-size:16px}.ts{font-size:13px}
.halo{paint-order:stroke;stroke:var(--f-bg,#0c1a28);stroke-width:4px;stroke-linejoin:round}
.ln{stroke:var(--f-line,#7e93a5);stroke-width:1.5;fill:none}.thin{stroke-width:1}.dash{stroke-dasharray:6 5}
.th{stroke:var(--f-th,#ef7d57);stroke-width:2;fill:none}.hy{stroke:var(--f-hy,#4aa3e8);stroke-width:2;fill:none}.me{stroke:var(--f-me,#e0b04a);stroke-width:2;fill:none}
.fth{fill:var(--f-th,#ef7d57)}.fhy{fill:var(--f-hy,#4aa3e8)}.fme{fill:var(--f-me,#e0b04a)}.fink{fill:var(--f-ink,#e8eff5)}
.bg{fill:var(--f-bg,#0c1a28)}.s1{fill:var(--f-s1,#4a4036)}.s2{fill:var(--f-s2,#2f4a5c)}.s3{fill:var(--f-s3,#3a3f46)}
.box{fill:var(--f-s3,#3a3f46);fill-opacity:.55;stroke:var(--f-line,#7e93a5);stroke-width:1.5}
</style><defs><marker id="ssi-mth" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-th,#ef7d57)"/></marker><marker id="ssi-mhy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-hy,#4aa3e8)"/></marker><marker id="ssi-mme" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-me,#e0b04a)"/></marker><marker id="ssi-mink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-line,#7e93a5)"/></marker></defs><rect class="bg" width="800" height="540" rx="6"/><text class="t tb tl" x="24" y="32">Soil–structure interaction beneath a footing</text><text class="t tm ts" x="24" y="52">Schematic only. Not measured data.</text><rect class="s1" x="40" y="230" width="480" height="100"/><rect class="s3" x="40" y="330" width="480" height="110"/><rect class="ln" x="40" y="230" width="480" height="210"/><line class="ln" x1="40" y1="330" x2="520" y2="330"/><text class="t tm ts halo" x="514" y="322" text-anchor="end">Soft soil</text><text class="t tm ts halo" x="514" y="432" text-anchor="end">Stiffer soil</text><g data-layer="structure" data-tip="Foundation system: a column carries the structural load P into a spread footing, which transfers it to the supporting soil." tabindex="0"><rect class="box" x="262" y="112" width="36" height="94"/><rect class="box" x="220" y="206" width="120" height="24"/><line class="me" x1="280" y1="56" x2="280" y2="108" marker-end="url(#ssi-mme)"/><text class="t ts" x="294" y="84">Structural load P</text></g><g data-layer="interface" data-tip="Interface: the contact zone between footing and soil. Its stiffness, friction and possible separation control how load is transferred." tabindex="0"><path class="th dash" style="stroke-width:3" d="M220 206 V230 H340 V206"/><text class="t ts" x="350" y="222">Soil–foundation interface</text></g><g data-layer="stress" data-tip="Stress distribution: vertical stress spreads and decays with depth, shown as isobars. The upward soil reaction at the contact balances the applied load." tabindex="0"><path class="me thin dash" d="M220 230 A60 55 0 0 0 340 230"/><path class="me thin dash" d="M180 230 A100 95 0 0 0 380 230"/><path class="me thin dash" d="M135 230 A145 135 0 0 0 425 230"/><text class="t ts halo" x="514" y="300" text-anchor="end">Stress isobars</text><line class="me" x1="232" y1="262" x2="232" y2="234" marker-end="url(#ssi-mme)"/><line class="me" x1="262" y1="262" x2="262" y2="234" marker-end="url(#ssi-mme)"/><line class="me" x1="298" y1="262" x2="298" y2="234" marker-end="url(#ssi-mme)"/><line class="me" x1="328" y1="262" x2="328" y2="234" marker-end="url(#ssi-mme)"/><text class="t ts halo" x="350" y="262">Soil reaction</text></g><line class="ln thin dash" x1="220" y1="440" x2="220" y2="480"/><line class="ln thin dash" x1="340" y1="440" x2="340" y2="480"/><line class="ln thin dash" x1="40" y1="480" x2="520" y2="480"/><g data-layer="settlement" data-tip="Settlement: the ground surface settles most beneath the footing and recovers with distance. Differential settlement matters for structural distress." tabindex="0"><path class="me" d="M40 480 C150 482 220 514 280 516 C340 514 410 482 520 480"/><text class="t ts" x="40" y="498">Settlement profile δ (exaggerated)</text><line class="ln" x1="280" y1="482" x2="280" y2="512" marker-end="url(#ssi-mink)" marker-start="url(#ssi-mink)"/><text class="t ts" x="330" y="513">δmax</text></g><text class="t tb" x="570" y="118">Legend</text><line class="me" x1="570" y1="140" x2="600" y2="140" marker-end="url(#ssi-mme)"/><text class="t ts" x="610" y="145">Load, stress, settlement</text><line class="th dash" x1="570" y1="166" x2="600" y2="166" style="stroke-width:3"/><text class="t ts" x="610" y="171">Interface</text><rect class="box" x="570" y="186" width="30" height="14"/><text class="t ts" x="610" y="198">Structure</text><text class="t tm ts" x="570" y="250">Contact pressure depends</text><text class="t tm ts" x="570" y="267">on footing rigidity,</text><text class="t tm ts" x="570" y="284">soil stiffness and</text><text class="t tm ts" x="570" y="301">interface behaviour.</text></svg>