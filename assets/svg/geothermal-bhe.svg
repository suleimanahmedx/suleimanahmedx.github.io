<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="bhe-t bhe-d" id="svg-bhe"><title id="bhe-t">Ground-source heat exchange</title><desc id="bhe-d">A building with a heat pump connected to a vertical borehole heat exchanger with a U-tube in a three-layer ground profile. Arrows show heat flowing from the ground to the loop in winter, a thermal influence zone around the borehole, groundwater flow carrying heat, and a ground temperature profile with a fading seasonal swing.</desc><style>
.t{font:14px Inter,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;fill:var(--f-ink,#e8eff5)}
.tm{fill:var(--f-mute,#9db0c0)}.tb{font-weight:600}.tl{font-size:16px}.ts{font-size:13px}
.halo{paint-order:stroke;stroke:var(--f-bg,#0c1a28);stroke-width:4px;stroke-linejoin:round}
.ln{stroke:var(--f-line,#7e93a5);stroke-width:1.5;fill:none}.thin{stroke-width:1}.dash{stroke-dasharray:6 5}
.th{stroke:var(--f-th,#ef7d57);stroke-width:2;fill:none}.hy{stroke:var(--f-hy,#4aa3e8);stroke-width:2;fill:none}.me{stroke:var(--f-me,#e0b04a);stroke-width:2;fill:none}
.fth{fill:var(--f-th,#ef7d57)}.fhy{fill:var(--f-hy,#4aa3e8)}.fme{fill:var(--f-me,#e0b04a)}.fink{fill:var(--f-ink,#e8eff5)}
.bg{fill:var(--f-bg,#0c1a28)}.s1{fill:var(--f-s1,#4a4036)}.s2{fill:var(--f-s2,#2f4a5c)}.s3{fill:var(--f-s3,#3a3f46)}
.box{fill:var(--f-s3,#3a3f46);fill-opacity:.55;stroke:var(--f-line,#7e93a5);stroke-width:1.5}
</style><defs><marker id="bhe-mth" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-th,#ef7d57)"/></marker><marker id="bhe-mhy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-hy,#4aa3e8)"/></marker><marker id="bhe-mme" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-me,#e0b04a)"/></marker><marker id="bhe-mink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-line,#7e93a5)"/></marker></defs><rect class="bg" width="800" height="480" rx="6"/><text class="t tb tl" x="24" y="32">Ground-source heat exchange with a borehole</text><text class="t tm ts" x="24" y="52">Schematic only. Not measured data.</text><rect class="s1" x="40" y="130" width="480" height="60"/><rect class="s2" x="40" y="190" width="480" height="130"/><rect class="s3" x="40" y="320" width="480" height="120"/><rect class="ln" x="40" y="130" width="480" height="310"/><line class="ln" x1="40" y1="190" x2="520" y2="190"/><line class="ln" x1="40" y1="320" x2="520" y2="320"/><line class="ln" x1="30" y1="130" x2="530" y2="130" style="stroke-width:3"/><text class="t tm ts halo" x="514" y="182" text-anchor="end">Seasonal temperature zone</text><text class="t tm ts halo" x="514" y="312" text-anchor="end">Steady-temperature ground</text><text class="t tm ts halo" x="514" y="432" text-anchor="end">Deeper ground</text><rect class="box" x="70" y="84" width="110" height="46"/><path class="ln" d="M62 84 L125 56 L188 84"/><rect class="bg ln" x="96" y="100" width="34" height="30"/><text class="t ts" x="196" y="104">Building</text><g data-layer="loop" data-tip="Heat exchanger: a closed loop of pipe in a grouted borehole circulates fluid between the ground and a heat pump. Fluid returns colder in winter and warmer in summer." tabindex="0"><rect class="box" x="322" y="130" width="16" height="280" style="fill-opacity:.9"/><path class="th" d="M327 130 V396 Q 330 408 333 396 V130"/><path class="ln" d="M180 142 H327"/><path class="ln" d="M180 154 H333"/><line class="th" x1="200" y1="142" x2="260" y2="142" marker-end="url(#bhe-mth)"/><line class="hy" x1="260" y1="154" x2="200" y2="154" marker-end="url(#bhe-mhy)"/><text class="t ts" x="350" y="208">Borehole heat exchanger</text><text class="t tm ts" x="350" y="224">(U-tube in grout)</text><text class="t ts" x="70" y="172">Circulating fluid</text></g><g data-layer="flux" data-tip="Heat flow: in heating mode the loop extracts heat from the surrounding ground. In cooling mode the direction reverses and heat is rejected to the ground." tabindex="0"><line class="th" x1="456" y1="240" x2="350" y2="240" marker-end="url(#bhe-mth)"/><line class="th" x1="200" y1="264" x2="306" y2="264" marker-end="url(#bhe-mth)"/><text class="t ts halo" x="380" y="262">Winter: heat flows</text><text class="t ts halo" x="380" y="279">from ground to loop</text><text class="t tm ts" x="60" y="288">In summer the direction</text><text class="t tm ts" x="60" y="305">reverses: heat is stored</text></g><g data-layer="ground" data-tip="Thermal influence zone: temperature around the borehole shifts over seasons and years. Spacing and operating temperatures must keep neighbouring boreholes from interfering." tabindex="0"><ellipse class="th thin dash" cx="330" cy="270" rx="70" ry="110"/><ellipse class="th thin dash" cx="330" cy="270" rx="125" ry="140"/><text class="t ts halo" x="520" y="380" text-anchor="end">Thermal influence zone</text></g><g data-layer="water" data-tip="Groundwater flow: moving groundwater carries heat (advection), which can improve recharge of the ground and shifts the thermal plume downstream." tabindex="0"><line class="hy" x1="66" y1="352" x2="250" y2="352" marker-end="url(#bhe-mhy)"/><line class="hy" x1="66" y1="372" x2="250" y2="372" marker-end="url(#bhe-mhy)"/><text class="t ts halo" x="66" y="342">Groundwater flow</text><text class="t ts halo" x="66" y="396">carries heat by advection</text></g><text class="t tb ts" x="580" y="118">Ground temperature</text><rect class="ln thin" x="570" y="130" width="220" height="310"/><g data-layer="profile" data-tip="Ground temperature: the seasonal swing fades within the upper ground. Below it, temperature is nearly steady, then rises slowly with depth along the geothermal gradient." tabindex="0"><path class="th" d="M770 130 C745 150 710 175 692 195"/><path class="hy" d="M612 130 C640 150 675 175 692 195"/><path class="ln" d="M692 195 L712 440"/><circle cx="692" cy="195" r="4" class="fink"/><text class="t ts halo" x="574" y="168">Seasonal</text><text class="t ts halo" x="574" y="185">swing</text><text class="t ts halo" x="686" y="250" text-anchor="end">Nearly constant</text><text class="t ts halo" x="686" y="267" text-anchor="end">temperature</text><text class="t ts halo" x="702" y="396" text-anchor="end">Slight increase</text><text class="t ts halo" x="702" y="413" text-anchor="end">with depth</text></g><text class="t tm ts" x="574" y="458">colder</text><text class="t tm ts" x="786" y="458" text-anchor="end">warmer</text></svg>